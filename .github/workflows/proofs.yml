name: watchos-proofs

# Each STEP is one concept — read the step names top to bottom, that is the checklist.
# When everything finishes, the last job ("RESULTS") prints ONE block to copy and paste.
on: [push, pull_request, workflow_dispatch]

jobs:
  # ---------------------------------------------------------------------------
  flutter-side:
    name: "Flutter side — runs on a Mac"
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ./watchos-proofs/flutter_proofs
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: "Record tool versions"
        run: bash "$GITHUB_WORKSPACE/watchos-proofs/scripts/env_info.sh" flutter

      - name: "F0 · Flutter dependencies resolve"
        run: bash "$GITHUB_WORKSPACE/watchos-proofs/scripts/step.sh" F0 flutter pub get

      - name: "P2 · Flutter captures a frame with no window (toImage -> raw RGBA, sizes match the bandwidth table)"
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/watchos-proofs/scripts/step.sh" P2 flutter test test/p2_headless_frame_capture_test.dart

      - name: "P3 · A tap injected through GestureBinding changes the next captured frame"
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/watchos-proofs/scripts/step.sh" P3 flutter test test/p3_tap_injection_test.dart

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: results-flutter
          path: /tmp/proof_results.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: logs-flutter
          path: /tmp/proof_logs
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  swift-watchos:
    name: "Swift side — watchOS Simulator"
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ./watchos-proofs
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: "Record tool versions"
        run: bash scripts/env_info.sh swift

      - name: "P1 · A watchOS Simulator exists on this runner and boots"
        timeout-minutes: 15
        run: bash scripts/step.sh P1 bash scripts/pick_watch_sim.sh

      - name: "P0 · The Swift code compiles for watchOS"
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: bash scripts/step.sh --sim P0 bash scripts/build_swift.sh

      - name: "P4 · Raw RGBA bytes become a CGImage with the right pixels"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/step.sh --sim P4 bash scripts/run_swift_test.sh P4_RgbaToCGImageTests

      - name: "P5 · SwiftUI Canvas draws the frame it is given (pixels checked)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/step.sh --sim P5 bash scripts/run_swift_test.sh P5_CanvasDrawsPixelsTests

      - name: "P6 · Dart WebSocket server -> watchOS client: a frame comes down, a tap goes up"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/step.sh --sim P6 bash scripts/run_p6_with_server.sh

      - name: "A1 · [Appendix A] Canvas text anchored .topLeading stays in the corner; .center does not"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/step.sh --sim A1 bash scripts/run_swift_test.sh A1_TextAnchorTests

      - name: "A2 · [Appendix A] Triple-buffer mailbox: writer never blocks, newest frame wins"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/step.sh --sim A2 bash scripts/run_swift_test.sh A2_MailboxTests

      - name: "A3 · [Appendix A] Bytes written by Dart are parsed correctly by Swift (incl. padding, misaligned base)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: >
          bash scripts/step.sh --sim A3 bash -c
          'dart run dart_tools/gen_wire_fixture.dart && bash scripts/run_swift_test.sh A3_WireFormatTests'

      - name: "A4 · [Appendix A] A @_cdecl Swift function is found by dlsym (what DynamicLibrary.process() uses)"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bash scripts/step.sh --sim A4 bash scripts/run_swift_test.sh A4_CdeclSymbolTests

      - name: "Collect measurements logged by the tests"
        if: ${{ always() }}
        run: |
          if [ -f /tmp/watch_proofs/results.log ]; then
            sed 's/^/INFO|SIM|/' /tmp/watch_proofs/results.log >> /tmp/proof_results.txt
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: results-swift
          path: /tmp/proof_results.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: logs-swift
          path: |
            /tmp/proof_logs
            /tmp/xcodebuild_*.log
            /tmp/ws_server.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  report:
    name: "RESULTS — open this job and copy the block"
    needs: [flutter-side, swift-watchos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: results
      - name: "Print the result sheet"
        run: python3 watchos-proofs/scripts/report.py results
